# contratos-spi: Angular (build de produção) + API FastAPI
# Modelo: scripts/instalar.sh substitui __PORTA__/__DEFAULT__/__PROJETO__ e grava em /etc/nginx/sites-available/contratos-spi
server {
    listen __PORTA__ __DEFAULT__;
    listen [::]:__PORTA__ __DEFAULT__;
    server_name _;

    root __PROJETO__/frontend/dist/contratos-spi/browser;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Anexos PDF de até ANEXOS_TAMANHO_MAXIMO_MB (20 MB) + margem do multipart
    client_max_body_size 30m;  # PDFs de até 25 MB (ANEXOS_TAMANHO_MAXIMO_MB) mais o formulário

    # API FastAPI (systemd: contratos-spi-api, uvicorn em 127.0.0.1:8000)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Arquivos com hash no nome: cache longo
    location ~* \.(?:js|css|woff2?|ttf)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location /assets/ {
        try_files $uri =404;
        expires 7d;
    }

    # SPA: rotas do Angular caem no index.html, que nunca é cacheado
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options SAMEORIGIN always;
    }
}
