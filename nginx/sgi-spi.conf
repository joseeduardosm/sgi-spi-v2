# sgi-spi: Angular (build de produção) + API FastAPI
# Modelo: scripts/instalar.sh substitui __PORTA__/__DEFAULT__/__PROJETO__/__DOMINIO__ e grava em /etc/nginx/sites-available/sgi-spi
#
# HTTPS em __DOMINIO__ (certificado da SPI-AD01-CA, com a cadeia, em /etc/ssl/certs/__DOMINIO__.fullchain.crt; chave em
# /etc/ssl/private/__DOMINIO__.key). Qualquer outro acesso (HTTP, pelo IP ou por outro nome) redireciona para
# https://__DOMINIO__ com o mesmo caminho. Exceção: o próprio servidor (127.0.0.1/localhost), usado nas verificações.

map "$scheme:$host" $sgi_spi_redirecionar_https {
    "https:__DOMINIO__" 0;
    "http:127.0.0.1" 0;
    "http:localhost" 0;
    default 1;
}

server {
    listen __PORTA__ __DEFAULT__;
    listen [::]:__PORTA__ __DEFAULT__;
    # `http2` no listen: o Nginx 1.24 do servidor ainda não tem a diretiva `http2 on`
    listen 443 ssl http2 __DEFAULT__;
    listen [::]:443 ssl http2 __DEFAULT__;
    server_name __DOMINIO__ _;

    ssl_certificate /etc/ssl/certs/__DOMINIO__.fullchain.crt;
    ssl_certificate_key /etc/ssl/private/__DOMINIO__.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:sgi_spi_ssl:10m;
    ssl_session_timeout 1d;

    if ($sgi_spi_redirecionar_https) {
        return 301 https://__DOMINIO__$request_uri;
    }

    root __PROJETO__/frontend/dist/sgi-spi/browser;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Anexos PDF de até ANEXOS_TAMANHO_MAXIMO_MB (20 MB) + margem do multipart
    client_max_body_size 30m;  # PDFs de até 25 MB (ANEXOS_TAMANHO_MAXIMO_MB) mais o formulário

    # API FastAPI (systemd: sgi-spi-api, uvicorn em 127.0.0.1:8000)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Arquivos com hash no nome: cache longo
    location ~* \.(?:js|css|woff2?|ttf)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location /assets/ {
        try_files $uri =404;
        expires 7d;
    }

    # SPA: rotas do Angular caem no index.html, que nunca é cacheado
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options SAMEORIGIN always;
    }
}
